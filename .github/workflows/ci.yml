name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install checksum-pinned actionlint
        run: |
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/actionlint.tar.gz" \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          printf '%s  %s\n' '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8' \
            "$RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check -
          mkdir "$RUNNER_TEMP/actionlint"
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP/actionlint"
      - name: Validate workflows
        run: '"$RUNNER_TEMP/actionlint/actionlint" -color'

  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}
      AWS_EC2_METADATA_DISABLED: "true"
      LANGSMITH_TRACING: "false"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.5.9"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --all-packages --all-extras --locked
      - name: Check formatting
        run: uv run --frozen --no-sync ruff format --check .
      - name: Lint
        run: uv run --frozen --no-sync ruff check .
      - name: Type check
        run: uv run --frozen --no-sync mypy apps/api/src
      - name: Test without external network access
        run: |
          sudo unshare --net -- sh -c 'ip link set lo up && exec "$@"' sh \
            setpriv --reuid="$(id -u)" --regid="$(id -g)" --init-groups --no-new-privs \
            "$GITHUB_WORKSPACE/.venv/bin/python" -m pytest apps/api/tests \
            --disable-socket --allow-unix-socket --cov \
            --cov-report=term-missing --cov-report=xml
      - name: Build Python distributions
        run: uv build --package incident-investigator-api

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Test without external network access
        run: |
          sudo unshare --net -- sh -c 'ip link set lo up && exec "$@"' sh \
            setpriv --reuid="$(id -u)" --regid="$(id -g)" --init-groups --no-new-privs \
            "$(command -v node)" node_modules/vitest/vitest.mjs run --root apps/web
      - name: Check workspace ownership
        run: |
          unexpected_owner="$(find apps/web/node_modules -xdev ! -user "$(id -un)" -print -quit)"
          if [ -n "$unexpected_owner" ]; then
            echo "Test execution left a file owned by another user: $unexpected_owner" >&2
            exit 1
          fi
      - name: Build
        run: npm run build
      - name: Audit dependencies
        run: npm audit --audit-level=moderate
