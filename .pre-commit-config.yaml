minimum_pre_commit_version: "4.1.0"
default_install_hook_types: [pre-commit, pre-push]
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff lint
        entry: uv run --frozen --no-sync ruff check
        language: system
        types: [python]
      - id: ruff-format
        name: Ruff format
        entry: uv run --frozen --no-sync ruff format --check
        language: system
        types: [python]
      - id: mypy
        name: Mypy
        entry: uv run --frozen --no-sync mypy apps/api/src
        language: system
        pass_filenames: false
        files: ^(apps/api/.*\.py|pyproject\.toml|uv\.lock)$
      - id: web-typecheck
        name: Web typecheck
        entry: npm run typecheck
        language: system
        pass_filenames: false
        files: ^(apps/web/|package(-lock)?\.json$)
      - id: web-lint
        name: Web lint
        entry: npm run lint
        language: system
        pass_filenames: false
        files: ^(apps/web/|package(-lock)?\.json$)
      - id: tests
        name: Deterministic tests
        entry: uv run --frozen --no-sync pytest apps/api/tests --cov
        language: system
        pass_filenames: false
        stages: [pre-push]
      - id: web-tests
        name: Web tests
        entry: npm test
        language: system
        pass_filenames: false
        stages: [pre-push]
