[project]
name = "incident-investigator-api"
version = "0.1.0"
description = "Evidence-first AWS incident investigation API and LangGraph runtime"
requires-python = ">=3.12,<3.15"
dependencies = [
  "aiosqlite>=0.20,<1",
  "boto3>=1.35,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "langgraph>=1.0,<2",
  "orjson>=3.10,<4",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "python-multipart>=0.0.18,<1",
  "pyyaml>=6.0,<7",
  "rfc8785>=0.1.4,<0.2",
  "sqlalchemy>=2.0,<3",
  "structlog>=24.4,<26",
  "typer>=0.15,<1",
  "uvicorn[standard]>=0.34,<1"
]

[project.optional-dependencies]
dev = [
  "coverage[toml]>=7.6,<8",
  "hypothesis>=6.120,<7",
  "mypy>=1.14,<2",
  "pip-audit>=2.9,<3",
  "playwright>=1.58,<2",
  "pre-commit>=4.1,<5",
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.25,<2",
  "pytest-cov>=6.0,<7",
  "pytest-socket>=0.7,<1",
  "ruff>=0.9,<1"
]

[project.scripts]
incident-api = "incident_investigator.main:run"
incident-eval = "incident_investigator.evaluation.cli:app"
incidentctl = "incident_investigator.security.cli:app"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/incident_investigator"]
